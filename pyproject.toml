[project]
name = "python-oephys"
dynamic = ["version"]

description = "Python interface and utilities for working with Open Ephys devices and electrophysiology data"
authors = [
    { name = "Jonathan Shulgach", email = "jshulgac@andrew.cmu.edu" },
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["open-ephys", "emg", "neurotech", "signal processing", "biomedical"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy==1.14.1",
    "matplotlib",
    "tqdm",
    "torch",
    "pandas",
    #"PySerial",
    "scikit-learn",
    # "nvidia-cuda-toolkit", # This is not a Python package, but a system package
    #"tensorflow==2.19.0",
	"pyyaml",
    "PyQt5",
    "pyqtgraph",
    "PyOpenGL>=3.1.7",
    "PyOpenGL-accelerate>=3.1.7",
    #"pyyaml",
    "pyzmq",
    "pyserial",
    "open-ephys-python-tools",
    "pylsl",
]
[project.urls]
Homepage = "https://github.com/Neuro-Mechatronics-Interfaces/python-open-ephys"
Documentation = "https://neuro-mechatronics-interfaces.github.io/python-open-ephys/"
Repository = "https://github.com/Neuro-Mechatronics-Interfaces/python-open-ephys.git"
Issues = "https://github.com/Neuro-Mechatronics-Interfaces/python-open-ephys/issues"

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/pyoephys/_version.py"
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+(?:[.-]?(?:a|b|rc)\\d+)?)$"
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"
local_scheme = "no-local-version"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyoephys*"]

[tool.setuptools.package-data]
# include all files under pyoephys/io/data/**
"pyoephys.io.data" = ["**/*"]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
]
gui = ["PyQt5", "pyqtgraph", "PyOpenGL>=3.1.7", "PyOpenGL-accelerate>=3.1.7"]
ml = ["torch", "scikit-learn", "joblib"]

[project.scripts]
pyoephys-lsl2npz = "pyoephys.applications.lsl2npz:lsl2npz_cli"
pyoephys-playback = "pyoephys.interface._playback_client:playback_cli"

